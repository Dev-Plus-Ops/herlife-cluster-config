image:
  repository: ghcr.io/akilapilapitiya/herlife-app/app
  tag: dev-main-6501401
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
replicaCount: 1
service:
  port: 80
ingress:
  enabled: true
  className: traefik
  host: app-dev-herlife.itsakila.me
  tls:
    enabled: true
    secretName: herlife-tls
env:
  # Injected into the pod and consumed at container startup by the image's
  # docker-entrypoint.sh, which writes runtime config (config.js) for the SPA.
  API_URL: https://api-dev-herlife.itsakila.me

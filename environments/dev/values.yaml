image:
  repository: ghcr.io/akilapilapitiya/herlife-app/app
  tag: dev-main-648271f
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

replicaCount: 1

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  host: app-dev-herlife.itsakila.me
  tls:
    enabled: true
    secretName: herlife-tls

env:
  # VITE_* variables are baked into the bundle at image build time (the GitHub
  # workflow passes them as build-args); this value documents the desired state
  # and is available as a container env var at runtime.
  VITE_API_BASE_URL: https://api-dev-herlife.itsakila.me


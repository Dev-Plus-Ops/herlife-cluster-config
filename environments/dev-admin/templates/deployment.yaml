apiVersion: apps/v1
kind: Deployment
metadata:
  name: herlife-admin
  labels:
    app.kubernetes.io/name: herlife-admin
    app.kubernetes.io/part-of: herlife
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: herlife-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: herlife-admin
        app.kubernetes.io/part-of: herlife
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http

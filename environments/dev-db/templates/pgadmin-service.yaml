{{- if .Values.pgadmin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: herlife-pgadmin
  labels:
    app.kubernetes.io/name: herlife-pgadmin
    app.kubernetes.io/part-of: herlife
spec:
  selector:
    app.kubernetes.io/name: herlife-pgadmin
  ports:
    - name: http
      port: {{ .Values.pgadmin.service.port }}
      targetPort: http
      protocol: TCP
  type: ClusterIP
{{- end }}

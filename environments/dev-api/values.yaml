image:
  repository: ghcr.io/akilapilapitiya/herlife-app/api
  tag: dev-feat-backend-foundation-7afdb42
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
replicaCount: 1
service:
  port: 80
env:
  GIN_MODE: release
  CORS_ALLOWED_ORIGINS: https://app-dev-herlife.itsakila.me,https://admin-dev-herlife.itsakila.me
  # PostgreSQL: CloudNativePG herlife-db cluster (same namespace, <name>-rw service)
  DB_HOST: herlife-db-rw.herlife-dev.svc.cluster.local
  DB_PORT: "5432"
  DB_USER: app
  DB_NAME: herlife_dev
# Sensitive values are pulled from the CNPG-managed app-user secret at pod
# startup — no passwords in git. The secret is the bootstrap.initdb.secret
# the db chart references (herlife-db-app).
envSecretKeyRefs:
  DB_PASSWORD:
    secret: herlife-db-app
    key: password
  JWT_SECRET:
    secret: herlife-api-jwt
    key: secret
ingress:
  enabled: true
  className: traefik
  host: api-dev-herlife.itsakila.me
  tls:
    enabled: true
    secretName: herlife-api-tls
# Probe tuning. The readiness target is /health (plain HTTP): the API has no
# backing dependencies to check, so readiness simply reports the process is
# accepting requests.
startupProbe:
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 30 # allow up to 90s of boot time before liveness starts
readinessProbe:
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
livenessProbe:
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

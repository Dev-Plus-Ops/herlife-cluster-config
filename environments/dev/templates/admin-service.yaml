apiVersion: v1
kind: Service
metadata:
  name: herlife-admin
  labels:
    app.kubernetes.io/name: herlife-admin
    app.kubernetes.io/part-of: herlife
spec:
  selector:
    app.kubernetes.io/name: herlife-admin
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
  type: ClusterIP

{{- if .Values.pgadmin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: herlife-pgadmin
  labels:
    app.kubernetes.io/name: herlife-pgadmin
    app.kubernetes.io/part-of: herlife
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: herlife-pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: herlife-pgadmin
        app.kubernetes.io/part-of: herlife
    spec:
      containers:
        - name: pgadmin
          image: {{ .Values.pgadmin.image }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.pgadmin.loginSecret }}
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
      volumes:
        - name: pgadmin-data
          emptyDir: {}
{{- end }}
